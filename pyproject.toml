[project]
name = "slm-multihead"
version = "0.1.0"
description = "Frozen multimodal Qwen with tool and guardrail classification heads"
requires-python = ">=3.12"
dependencies = ["torch==2.11.0", "torchvision==0.26.0", "transformers==5.14.1", "scikit-learn>=1.7", "psutil>=6", "pillow>=12", "fugashi>=1.5", "unidic-lite>=1.0"]

[dependency-groups]
dev = ["pytest>=9"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
